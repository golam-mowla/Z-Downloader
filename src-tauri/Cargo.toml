[package]
name = "z-downloader"
version = "0.0.0"
description = "Z Downloader - Cyberpunk Edition Fast Media & Torrent Downloader with IDM Interceptor"
authors = ["Golam Mowla"]
edition = "2021"

[lib]
name = "z_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
